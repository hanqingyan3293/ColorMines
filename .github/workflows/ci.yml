name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------- core --
  core:
    name: Core (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # -------------------------------------------------------------------- web --
  web:
    name: Web (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ---------------------------------------------------------------- ui test --
  ui:
    name: UI (Playwright)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: npm run test:ui

  # ---------------------------------------------------------------- desktop --
  desktop:
    name: Desktop (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      # Cargo shares the same target dir across jobs when cached; without it a
      # full Tauri build takes ~15 minutes, with it ~3.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm run tauri:build

      - uses: actions/upload-artifact@v4
        with:
          name: ColorMines-setup
          path: src-tauri/target/release/bundle/nsis/*.exe

# ---------------------------------------------------------------------------
# Every tier in src/core/tiers.ts is measured, not guessed. `npm run mass`
# reproduces those numbers; it is not run in CI because it is a measurement
# tool, not a pass/fail gate.
# ---------------------------------------------------------------------------
